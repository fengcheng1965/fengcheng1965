<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .game-container {
            position: relative;
            border: 2px solid #333;
            background-color: #fff;
        }
        
        #game-board {
            display: grid;
            grid-template-columns: repeat(20, 20px);
            grid-template-rows: repeat(20, 20px);
            gap: 1px;
            background-color: #ddd;
        }
        
        .cell {
            width: 20px;
            height: 20px;
            background-color: #fff;
        }
        
        .snake {
            background-color: #4CAF50;
            border-radius: 4px;
        }
        
        .food {
            background-color: #f44336;
            border-radius: 50%;
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            width: 400px;
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        
        .controls {
            margin-top: 20px;
        }
        
        button {
            padding: 10px 20px;
            margin: 0 5px;
            font-size: 16px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #555;
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            z-index: 100;
        }
        
        .game-over h2 {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>贪吃蛇游戏</h1>
    
    <div class="game-container">
        <div id="game-board"></div>
        <div id="game-over" class="game-over" style="display: none;">
            <h2>游戏结束！</h2>
            <p id="final-score"></p>
            <button onclick="restartGame()">重新开始</button>
        </div>
    </div>
    
    <div class="game-info">
        <div>分数: <span id="score">0</span></div>
        <div>等级: <span id="level">1</span></div>
    </div>
    
    <div class="controls">
        <button onclick="startGame()">开始游戏</button>
        <button onclick="pauseGame()">暂停</button>
        <button onclick="restartGame()">重新开始</button>
    </div>
    
    <div style="margin-top: 20px;">
        <p>操作说明: 使用方向键控制蛇的移动</p>
    </div>
    
    <script>
        // 游戏常量
        const GRID_SIZE = 20;
        const CELL_SIZE = 20;
        
        // 游戏状态
        let gameBoard = [];
        let snake = [];
        let food = {};
        let direction = 'right';
        let nextDirection = 'right';
        let gameInterval;
        let score = 0;
        let level = 1;
        let speed = 200;
        let gameRunning = false;
        
        // 初始化游戏板
        function initGameBoard() {
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            gameBoard = [];
            
            for (let y = 0; y < GRID_SIZE; y++) {
                const row = [];
                for (let x = 0; x < GRID_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.x = x;
                    cell.dataset.y = y;
                    board.appendChild(cell);
                    row.push(cell);
                }
                gameBoard.push(row);
            }
        }
        
        // 初始化蛇
        function initSnake() {
            const startX = Math.floor(GRID_SIZE / 2);
            const startY = Math.floor(GRID_SIZE / 2);
            
            snake = [
                { x: startX, y: startY },
                { x: startX - 1, y: startY },
                { x: startX - 2, y: startY }
            ];
        }
        
        // 生成食物
        function generateFood() {
            let validPosition = false;
            let newFood;
            
            while (!validPosition) {
                newFood = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
                
                // 检查食物是否生成在蛇身上
                validPosition = true;
                for (const segment of snake) {
                    if (segment.x === newFood.x && segment.y === newFood.y) {
                        validPosition = false;
                        break;
                    }
                }
            }
            
            food = newFood;
        }
        
        // 渲染游戏
        function renderGame() {
            // 清空游戏板
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    gameBoard[y][x].classList.remove('snake', 'food');
                }
            }
            
            // 渲染蛇
            for (const segment of snake) {
                gameBoard[segment.y][segment.x].classList.add('snake');
            }
            
            // 渲染食物
            gameBoard[food.y][food.x].classList.add('food');
        }
        
        // 更新游戏状态
        function updateGame() {
            // 更新方向
            direction = nextDirection;
            
            // 计算新的蛇头位置
            const head = { ...snake[0] };
            
            switch (direction) {
                case 'up':
                    head.y -= 1;
                    break;
                case 'down':
                    head.y += 1;
                    break;
                case 'left':
                    head.x -= 1;
                    break;
                case 'right':
                    head.x += 1;
                    break;
            }
            
            // 检查碰撞
            if (checkCollision(head)) {
                endGame();
                return;
            }
            
            // 移动蛇
            snake.unshift(head);
            
            // 检查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                // 增加分数
                score += 10;
                document.getElementById('score').textContent = score;
                
                // 增加等级
                if (score % 50 === 0) {
                    level++;
                    document.getElementById('level').textContent = level;
                    // 增加速度
                    speed = Math.max(50, speed - 20);
                    clearInterval(gameInterval);
                    gameInterval = setInterval(updateGame, speed);
                }
                
                // 生成新食物
                generateFood();
            } else {
                // 移除蛇尾
                snake.pop();
            }
            
            // 渲染游戏
            renderGame();
        }
        
        // 检查碰撞
        function checkCollision(head) {
            // 检查边界碰撞
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                return true;
            }
            
            // 检查自身碰撞
            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    return true;
                }
            }
            
            return false;
        }
        
        // 开始游戏
        function startGame() {
            if (!gameRunning) {
                gameRunning = true;
                gameInterval = setInterval(updateGame, speed);
            }
        }
        
        // 暂停游戏
        function pauseGame() {
            gameRunning = false;
            clearInterval(gameInterval);
        }
        
        // 重新开始游戏
        function restartGame() {
            // 重置游戏状态
            pauseGame();
            score = 0;
            level = 1;
            speed = 200;
            direction = 'right';
            nextDirection = 'right';
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('game-over').style.display = 'none';
            
            // 初始化游戏
            initSnake();
            generateFood();
            renderGame();
        }
        
        // 结束游戏
        function endGame() {
            gameRunning = false;
            clearInterval(gameInterval);
            document.getElementById('final-score').textContent = `最终分数: ${score}`;
            document.getElementById('game-over').style.display = 'block';
        }
        
        // 处理键盘输入
        document.addEventListener('keydown', function(e) {
            switch (e.key) {
                case 'ArrowUp':
                    if (direction !== 'down') {
                        nextDirection = 'up';
                    }
                    break;
                case 'ArrowDown':
                    if (direction !== 'up') {
                        nextDirection = 'down';
                    }
                    break;
                case 'ArrowLeft':
                    if (direction !== 'right') {
                        nextDirection = 'left';
                    }
                    break;
                case 'ArrowRight':
                    if (direction !== 'left') {
                        nextDirection = 'right';
                    }
                    break;
            }
        });
        
        // 初始化游戏
        initGameBoard();
        initSnake();
        generateFood();
        renderGame();
    </script>
</body>
</html>
